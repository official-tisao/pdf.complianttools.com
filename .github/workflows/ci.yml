name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Relay render tests self-skip when the chromium binary is absent, so without
      # this they report green in CI while asserting nothing. The other three skip
      # conditions are `which` probes against a real install; this is the only one
      # that fires here.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm verify:source-safety
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:licenses
      - run: pnpm verify:assets
      - run: pnpm verify:trademarks
      - run: pnpm verify:plan-sync -- --base="${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: pnpm build

  no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/no-network.spec.ts

  batch-budget:
    # P7-07's Done-when — "a 50-file batch completes within budget and a 200-file
    # batch never OOMs" — is a claim about a load, so it has to be re-measured
    # rather than asserted once. This replaces a hand-written bundle that recorded
    # a 0.8 MB load against a 384 MB cap (99.6% headroom) and that nothing in the
    # repository could regenerate. The third case deliberately tightens the cap
    # until the governor must reduce concurrency, which is the behaviour README
    # §11.5 specifies; the previous implementation threw instead and fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm measure:batch-budget
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-07-batch-budget-evidence
          path: docs/release-gate/P7-07-evidence.json

  latency:
    # The README §19 budgets are only meaningful as a measured, repeated
    # figure in a real browser, so this job builds the app, serves it, and
    # records the result as release evidence. Kept out of `pnpm verify` because
    # it needs a running server and a browser, not just the unit gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Serve the built app
        run: pnpm exec vite preview --host 127.0.0.1 --port 4173 &
      - name: Measure §19 latency budgets
        run: pnpm verify:latency
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-03-latency-evidence
          path: docs/release-gate/P7-03-latency-evidence.json

  bundle:
    # Per-route bundle budget (README §7.6). Measures the bytes a browser
    # actually fetches from the production build, not the modulepreload graph,
    # so a route is only billed for what a user downloads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-03-bundle-evidence
          path: docs/release-gate/P7-03-bundle-evidence.json

  lighthouse:
    # Appendix E: Lighthouse mobile >= 95. Every category is gated, not just
    # performance, because a route can pass on speed while failing accessibility
    # or SEO outright.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-03-lighthouse-evidence
          path: docs/release-gate/P7-03-lighthouse-evidence.json

  accessibility:
    # STCC #10 (`axe` zero violations, keyboard operability) and STCC #11 (the
    # prerendered `ar` and `en-XA` locale variants). The audit runs against the
    # hydrated page, because axe can only see the DOM the browser built, not the
    # prerendered shell.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/accessibility.spec.ts

  workflows:
    # Every remaining e2e spec. `phase-f.spec.ts` is the largest file in the
    # suite and was previously run by no CI job at all — the recipe round-trip,
    # batch, scan and Relay coverage in it gated nothing. These four specs have
    # no browser-binary or service-worker requirement of their own beyond what
    # the dev server provides, so they share one build and one server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/design-tokens.spec.ts tests/e2e/workstream-d.spec.ts tests/e2e/phase-f.spec.ts tests/e2e/parity.spec.ts

  offline:
    # STCC #12: the service worker only exists in a production build, so this
    # job builds and previews rather than using the dev server the other e2e
    # jobs rely on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/offline.spec.ts
        env:
          OFFLINE: '1'

  credential-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec node --test scripts/harnesses.test.mjs
